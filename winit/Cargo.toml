[package]
name = "iced_winit"
description = "A runtime for iced on top of winit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[features]
default = ["x11", "wayland-dlopen"]
debug = ["iced_debug/enable"]
sysinfo = ["dep:sysinfo"]
unconditional-rendering = []
program = []
linux-theme-detection = ["dep:mundy", "mundy/async-io", "mundy/color-scheme"]
image = ["iced_runtime/image", "arboard/image-data"]
x11 = ["winit/x11"]
wayland = [
    "winit/wayland",
    "winit/wayland-csd-adwaita",
    "arboard/wayland-data-control",
    "wayland-protocols",
    "wayland-client",
    "raw-window-handle",
    "iced_runtime/wayland",
    "wayland-backend",
    "xkbcommon",
    "xkbcommon-dl",
    "xkeysym",
    "dep:cctk",
]
wayland-dlopen = ["winit/wayland-dlopen"]
wayland-decorations = ["winit/wayland-csd-adwaita"]
wayland-csd-adwaita = ["winit/wayland-csd-adwaita"]
a11y = ["iced_accessibility", "iced_accessibility/accesskit_winit", "iced_runtime/a11y"]
single-instance = []

[dependencies]
iced_debug.workspace = true
iced_program.workspace = true
iced_futures.workspace = true
iced_graphics.workspace = true
iced_runtime.workspace = true
iced_accessibility.workspace = true
iced_accessibility.optional = true

log.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
tracing.workspace = true
winit.workspace = true
winit-core.workspace = true
cursor-icon.workspace = true
window_clipboard.workspace = true
dnd.workspace = true
mime.workspace = true

sysinfo.workspace = true
sysinfo.optional = true

[target.'cfg(all(unix, not(any(target_os = "redox", target_family = "wasm", target_os = "android", target_vendor = "apple"))))'.dependencies]
mundy.workspace = true
mundy.optional = true
raw-window-handle.workspace = true
raw-window-handle.optional = true
cctk.workspace = true
cctk.optional = true
wayland-protocols.workspace = true
wayland-protocols.optional = true
wayland-client.workspace = true
wayland-client.optional = true
wayland-backend.workspace = true
wayland-backend.optional = true
xkbcommon.workspace = true
xkbcommon.optional = true
xkbcommon-dl.workspace = true
xkbcommon-dl.optional = true
xkeysym.workspace = true
xkeysym.optional = true
rustix.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys.workspace = true
web-sys.features = ["Document", "Window", "HtmlCanvasElement"]
wasm-bindgen-futures.workspace = true

[build-dependencies]
build_helpers = { path = "../build_helpers" }
