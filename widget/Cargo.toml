[package]
name = "iced_widget"
description = "The built-in widgets for iced"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
categories.workspace = true
keywords.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true

[features]
image = ["iced_renderer/image"]
svg = ["iced_renderer/svg"]
canvas = ["iced_renderer/geometry"]
qr_code = ["canvas", "dep:qrcode"]
wgpu = ["iced_renderer/wgpu-bare"]
markdown = ["dep:pulldown-cmark"]
highlighter = ["dep:iced_highlighter"]
advanced = []
a11y = ["iced_accessibility", "iced_runtime/a11y"]
wayland = ["iced_runtime/wayland"]

[dependencies]
iced_renderer.workspace = true
iced_runtime.workspace = true
iced_accessibility.workspace = true
iced_accessibility.optional = true

num-traits.workspace = true
log.workspace = true
rustc-hash.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true
window_clipboard.workspace = true
dnd.workspace = true

qrcode.workspace = true
qrcode.optional = true

pulldown-cmark.workspace = true
pulldown-cmark.optional = true

iced_highlighter.workspace = true
iced_highlighter.optional = true

[dev-dependencies]
iced_test.workspace = true

iced_renderer.workspace = true
iced_renderer.features = ["tiny-skia", "x11", "wayland"]

iced_widget.workspace = true
iced_widget.features = ["markdown"]

[build-dependencies]
build_helpers = { path = "../build_helpers" }
